<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Bijoy's traditional artwork gallery."
    >
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfcfe">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07111f">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Sarefull Islam Bijoy">
    <meta property="og:description" content="Bijoy's traditional artwork gallery.">
    <link rel="icon" type="image/png" href="favicon.png">

    <script>try{var t=localStorage.getItem("bijoy-theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
    <script>try{if(sessionStorage.getItem("bijoy-pt")&&!matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add("pt-cover")}catch(e){}</script>
    <title>Art Gallery — Bijoy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="site-header">

        <div class="container header-inner">

                href="index.html"

                aria-label="Bijoy Home"
            >

            </a>


            <button
                class="menu-toggle"

                <span></span>
                <span></span>

            <nav
                class="site-nav"
                aria-label="Main navigation"

                <a
                    href="index.html"
                    class="nav-link"
                    data-en="Home"
                    data-bn="হোম"
                >
                    Home
                </a>


                <a
                    href="education.html"
                    class="nav-link page-link"
                    data-en="Education"
                    data-bn="শিক্ষাযাত্রা"
                >
                    Education
                </a>


                <a
                    href="art.html"

                    data-en="Art Gallery"
                    data-bn="শিল্পকর্ম"

                    Art Gallery

                <a
                    href="projects.html"
                    class="nav-link page-link"
                    data-en="Projects"
                    data-bn="প্রজেক্ট"

                    Projects
                </a>



                <button
                    class="language-toggle"
                    data-language-toggle
                    type="button"
                    aria-label="Switch to Bangla"

                    বাংলা
                </button>


                <button
                    class="theme-toggle"
                    data-theme-toggle
                    type="button"
                    aria-label="Switch theme"
                >
                    <span class="theme-icon">◐</span>
                </button>

            </nav>

        </div>

    <!-- =====================================================

    ====================================================== -->

    <dialog
        class="art-lightbox"
        id="artLightbox"
    >

        <div class="lightbox-inner">

                type="button"
