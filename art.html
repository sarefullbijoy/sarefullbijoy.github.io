<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Bijoy's traditional artwork gallery."
    >

    <title>Art Gallery — Bijoy</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="site-header">

        <div class="container header-inner">

            <a
                href="index.html"
                class="site-logo"
                aria-label="Bijoy Home"
            >
                Bijoy<span class="logo-dot">.</span>
            </a>


            <button
                class="menu-toggle"
                data-menu-toggle
                type="button"
                aria-label="Open navigation"
                aria-expanded="false"
            >

                <span></span>
                <span></span>
                <span></span>

            </button>


            <nav
                class="site-nav"
                aria-label="Main navigation"
            >

                <a
                    href="index.html"
                    class="nav-link"
                    data-en="Home"
                    data-bn="হোম"
                >
                    Home
                </a>


                <a
                    href="education.html"
                    class="nav-link page-link"
                    data-en="Education"
                    data-bn="শিক্ষাযাত্রা"
                >
                    Education
                </a>


                <a
                    href="art.html"
                    class="nav-link page-link active"
                    data-en="Art Gallery"
                    data-bn="শিল্পকর্ম"
                >
                    Art Gallery
                </a>


                <button
                    class="language-toggle"
                    data-language-toggle
                    type="button"
                    aria-label="Switch to Bangla"
                >
                    বাংলা
                </button>


                <button
                    class="theme-toggle"
                    data-theme-toggle
                    type="button"
                    aria-label="Switch theme"
                >
                    <span class="theme-icon">◐</span>
                </button>

            </nav>

        </div>

    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>


        <!-- =================================================
             ART HEADER
        ================================================== -->

        <section class="art-hero">

            <div class="container">

                <span
                    class="page-eyebrow"
                    data-en="ART GALLERY"
                    data-bn="শিল্পকর্ম"
                >
                    ART GALLERY
                </span>


                <h1
                    data-en="My works."
                    data-bn="আমার শিল্পকর্ম।"
                >
                    My works.
                </h1>


                <p
                    data-en="Traditional artwork, studies and creative work."
                    data-bn="ঐতিহ্যবাহী শিল্পকর্ম, অনুশীলন ও সৃজনশীল কাজ।"
                >
                    Traditional artwork, studies and creative work.
                </p>

            </div>

        </section>



        <!-- =================================================
             GALLERY
        ================================================== -->

        <section
            class="art-gallery"
            aria-labelledby="gallery-title"
        >

            <div class="container">


                <div class="gallery-header">

                    <h2
                        id="gallery-title"
                        data-en="Selected works"
                        data-bn="নির্বাচিত কাজ"
                    >
                        Selected works
                    </h2>


                    <span
                        class="gallery-count"
                        data-en="TRADITIONAL ART"
                        data-bn="ঐতিহ্যবাহী শিল্প"
                    >
                        TRADITIONAL ART
                    </span>

                </div>



                <!-- =================================================
                     ART GRID
                ================================================== -->

                <div class="art-grid">


                    <!-- ART 01 -->

                    <button
                        class="art-item"
                        type="button"

                        data-lightbox

                        data-image="images/art-01.jpg"

                        data-title-en="Artwork 01"
                        data-title-bn="শিল্পকর্ম ০১"

                        data-date-en="2026"
                        data-date-bn="২০২৬"
                    >

                        <span class="art-image">

                            <img
                                src="images/art-01.jpg"
                                alt="Artwork 01"
                                loading="lazy"
                            >

                        </span>


                        <span class="art-info">

                            <strong
                                data-en="Artwork 01"
                                data-bn="শিল্পকর্ম ০১"
                            >
                                Artwork 01
                            </strong>


                            <small
                                data-en="2026"
                                data-bn="২০২৬"
                            >
                                2026
                            </small>

                        </span>

                    </button>

                    <button

                        type="button"

                            >
                                2026
                            </small>

                        </span>

                    </button>

                        <span class="art-info">

                            <strong
                                data-en="Artwork 04"

                        <span class="art-image">

                            <img

                            >

                        </span>


                        <span class="art-info">

                            <strong
                                data-en="Artwork 05"
                                data-bn="শিল্পকর্ম ০৫"
                            >
                                Artwork 05

                            <small

                    <button

                        <span class="art-image">

                            <img
                                src="images/art-06.jpg"

                        <span class="art-info">

                            <strong

                        </span>

                    </button>


                </div>

            </div>

        </section>


    </main>



    <!-- =====================================================
         LIGHTBOX
    ====================================================== -->

    <dialog
        class="art-lightbox"
        id="artLightbox"
    >

        <div class="lightbox-inner">


            <button
                class="lightbox-close"
                id="lightboxClose"
                type="button"
                aria-label="Close artwork"
            >
                ×
            </button>


            <div class="lightbox-image-wrap">

                <img
                    id="lightboxImage"
                    src=""
                    alt=""
                >

            </div>


            <div class="lightbox-info">

                <h2 id="lightboxTitle">
                    Artwork
                </h2>


                <span id="lightboxDate">
                    2026
                </span>

            </div>

        </div>

    </dialog>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="site-footer">

        <div class="container footer-inner">

            <p
                data-en="© 2026 Bijoy. Student · Artist · Lifelong Learner."
                data-bn="© ২০২৬ বিজয়। শিক্ষার্থী · শিল্পী · আজীবন শিক্ষার্থী।"
            >
                © 2026 Bijoy. Student · Artist · Lifelong Learner.
            </p>


            <a

    <script src="script.js"></script>

</html>
